name: LocalDroid Build

on:
  push:
    branches: [main]
    paths: ['LocalDroid/**', '.github/workflows/localdroid-build.yml']
  pull_request:
    paths: ['LocalDroid/**', '.github/workflows/localdroid-build.yml']
  workflow_dispatch:

concurrency:
  group: localdroid-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LocalDroid
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: sdkmanager "ndk;27.0.12077973" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: LocalDroid-apk
          path: LocalDroid/app/build/outputs/apk/release/*.apk
