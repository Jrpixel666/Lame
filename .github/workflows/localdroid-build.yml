name: LocalDroid Build

on:
  push:
    branches: [main]
    paths: ['LocalDroid/**', '.github/workflows/localdroid-build.yml']
  pull_request:
    paths: ['LocalDroid/**', '.github/workflows/localdroid-build.yml']
  workflow_dispatch:

concurrency:
  group: localdroid-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LocalDroid
    env:
      ANDROID_HOME: /opt/android-sdk
      ANDROID_SDK_ROOT: /opt/android-sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # android-actions/setup-android@v3 fails trying to install the long-removed
      # legacy "tools" package, so set up cmdline-tools by hand instead.
      - name: Install Android SDK (cmdline-tools, platform, NDK, CMake)
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -sS -L -o /tmp/cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" --licenses > /dev/null
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: LocalDroid-apk
          path: LocalDroid/app/build/outputs/apk/release/*.apk
