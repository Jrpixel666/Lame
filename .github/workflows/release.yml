name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish a release for (e.g. v2.1.0). Leave blank to just build artifacts without publishing.'
        required: false

jobs:
  android:
    name: Build Android APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build split-per-ABI release APKs
        run: flutter build apk --release --split-per-abi

      - name: Rename APKs for release
        run: |
          cd build/app/outputs/flutter-apk
          mv app-arm64-v8a-release.apk uncensored-local-ai-arm64-v8a.apk
          mv app-armeabi-v7a-release.apk uncensored-local-ai-armeabi-v7a.apk
          mv app-x86_64-release.apk uncensored-local-ai-x86_64.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

  linux:
    name: Build Linux bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Linux release
        run: flutter build linux --release

      - name: Zip bundle
        run: |
          cd build/linux/x64/release/bundle
          zip -r "$GITHUB_WORKSPACE/uncensored-local-ai-linux-x64.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: linux-bundle
          path: uncensored-local-ai-linux-x64.zip
          if-no-files-found: error

  windows:
    name: Build Windows bundle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Zip bundle
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath uncensored-local-ai-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-bundle
          path: uncensored-local-ai-windows-x64.zip
          if-no-files-found: error

  macos:
    name: Build macOS bundle
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build macOS release (unsigned)
        run: flutter build macos --release

      - name: Zip app bundle
        run: |
          cd build/macos/Build/Products/Release
          zip -r "$GITHUB_WORKSPACE/uncensored-local-ai-macos.zip" *.app

      - uses: actions/upload-artifact@v4
        with:
          name: macos-bundle
          path: uncensored-local-ai-macos.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [android, linux, windows, macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: true
