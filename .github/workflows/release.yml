name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish a release for (e.g. v2.1.0). Leave blank to just build artifacts without publishing.'
        required: false

jobs:
  android:
    name: Build Android APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # A single universal APK (all ABIs built in) rather than --split-per-abi,
      # so there's exactly one file to download and install for fully offline use.
      - name: Build universal release APK
        run: flutter build apk --release

      - name: Rename APK for release
        run: |
          cd build/app/outputs/flutter-apk
          mv app-release.apk uncensored-local-ai.apk

      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/uncensored-local-ai.apk
          if-no-files-found: error

  linux:
    name: Build Linux bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Linux release
        run: flutter build linux --release

      - name: Zip bundle
        run: |
          cd build/linux/x64/release/bundle
          zip -r "$GITHUB_WORKSPACE/uncensored-local-ai-linux-x64.zip" .

      - uses: actions/upload-artifact@v7
        with:
          name: linux-bundle
          path: uncensored-local-ai-linux-x64.zip
          if-no-files-found: error

  windows:
    name: Build Windows bundle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Zip bundle
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath uncensored-local-ai-windows-x64.zip

      - uses: actions/upload-artifact@v7
        with:
          name: windows-bundle
          path: uncensored-local-ai-windows-x64.zip
          if-no-files-found: error

  macos:
    name: Build macOS bundle
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build macOS release (unsigned)
        run: flutter build macos --release

      - name: Zip app bundle
        run: |
          cd build/macos/Build/Products/Release
          zip -r "$GITHUB_WORKSPACE/uncensored-local-ai-macos.zip" *.app

      - uses: actions/upload-artifact@v7
        with:
          name: macos-bundle
          path: uncensored-local-ai-macos.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [android, linux, windows, macos]
    runs-on: ubuntu-latest
    # Desktop builds are community-supported and best-effort — don't let a
    # Linux/Windows/macOS failure block shipping the Android APK, which is
    # the primary, fully-offline artifact this project ships.
    if: always() && startsWith(github.ref, 'refs/tags/') && needs.android.result == 'success'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
