name: portable_ai_flutter
description: "Portable AI — Run uncensored local LLMs natively on any device."
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # ── LLM Engine ──────────────────────────────────────────────────
  llamadart: ^0.17.0

  # ── State Management ────────────────────────────────────────────
  get: ^4.7.3                      # GetX - controllers, routing, state

  # ── Local Storage ───────────────────────────────────────────────
  hive_flutter: ^1.1.0             # Hive with Flutter init helpers
  hive: ^2.2.3                     # Hive core key-value + box storage

  # ── Networking / Downloads ──────────────────────────────────────
  http: ^1.6.0                     # HTTP requests + model downloading

  # ── File System ─────────────────────────────────────────────────
  path_provider: ^2.1.6            # App documents / downloads dir
  path: ^1.9.1                     # Path string utilities
  file_picker: ^13.3.0             # Cross-platform file/folder picker

  # ── UI Helpers ───────────────────────────────────────────────────
  flutter_markdown: ^0.7.7         # Render AI markdown responses (discontinued upstream — see CONTRIBUTING.md)
  google_fonts: ^9.0.0             # Inter font (matching FastChatUI)
  percent_indicator: ^4.2.5        # Download progress bars
  flutter_animate: ^4.5.2          # Micro-animations
  cupertino_icons: ^2.0.0

  # ── Background / Wake Lock ─────────────────────────────────────
  wakelock_plus: ^1.8.2              # Keep screen on during downloads
  flutter_foreground_task: ^11.0.3   # Foreground service for downloads/inference
  disable_battery_optimization: ^1.1.2 # Guide users to disable battery optimization

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1           # Hive type adapter code gen
  build_runner: ^2.4.13             # Code generation runner — hive_generator 2.0.1 is incompatible with any newer build_runner (verified via CI; see CONTRIBUTING.md)
  flutter_lints: ^6.0.0

hooks:
  user_defines:
    llamadart:
      # Only bundle the llama.cpp/GGUF runtime this app actually uses —
      # skips LiteRT-LM and Stable Diffusion to keep native binary size down.
      # (Replaces the pre-0.11 `llamadart_native_backends.platforms` key,
      # which llamadart no longer reads.)
      llamadart_native_runtimes: [llama_cpp]

flutter:
  uses-material-design: true
  assets:
    - assets/models_catalog.json
